name: Build & Deploy to GitHub Pages

# 트리거:
#   1) main 브랜치 푸시 시
#   2) 매일 KST 03:00 (= UTC 18:00) 자동 재빌드  → 그날의 최신 코드로 배포
#   3) 수동 실행 (Actions 탭 → Run workflow)
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# gh-pages 브랜치에 push 권한 필요
permissions:
  contents: write

# 동시 실행 방지 (cron + push가 겹쳐도 안전)
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_REPO_NAME: ${{ github.event.repository.name }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 매일 빌드 시 빈 변경이라도 커밋해 캐시 무효화
          allow_empty_commit: true
          commit_message: |
            chore(deploy): ${{ github.event_name == 'schedule' && '🕐 daily auto-deploy' || '🚀 manual/push deploy' }} @ ${{ github.sha }}
